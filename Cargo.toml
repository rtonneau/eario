[workspace]
resolver = "3"
members = [
    "crates/eario",
    "crates/eario-core",
    "crates/eario-data",
    "crates/eario-hub",
    "crates/eario-mcp",
    "crates/eario-runtime",
    "examples/data-explorer",
    "examples/hello-dashboard",
    "examples/signal-lab",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Minimum supported Rust version, tested in CI. Raised only on purpose:
# see docs/development/guide.md, "Minimum Rust version".
rust-version = "1.95"
repository = "https://github.com/rtonneau/eario"
homepage = "https://github.com/rtonneau/eario"
authors = ["The Eario contributors"]
keywords = ["dashboard", "data-visualization", "data-analysis", "local-first"]
categories = ["visualization", "science", "web-programming"]

[workspace.dependencies]
# Internal crates
eario = { path = "crates/eario", version = "0.2.0" }
eario-core = { path = "crates/eario-core", version = "0.2.0" }
eario-data = { path = "crates/eario-data", version = "0.2.0" }
eario-runtime = { path = "crates/eario-runtime", version = "0.2.0" }
eario-mcp = { path = "crates/eario-mcp", version = "0.2.0" }

# Serialization and errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

# Data
# Eager API only: the lazy engine roughly doubles the build and nothing uses it yet.
polars = { version = "0.55", default-features = false, features = ["csv", "fmt", "lazy"] }
calamine = "0.38"

# Runtime
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
mime_guess = "2"
webbrowser = "1"
directories = "6"
getrandom = "0.4"
sha2 = "0.11"
# Hub only: checks the minisign signature of a release's SHA256SUMS.txt
# (ADR 0013). Verification only, no dependency of its own.
minisign-verify = "0.3"
# Hub only: blocking HTTPS client for GitHub releases (ADR 0013), called
# through `spawn_blocking`. No default feature: no gzip, no webpki-roots
# (CDLA-Permissive-2.0 data) and no built-in crypto provider; the hub gives it
# rustls with ring and the system's root certificates, both already in the
# dependency tree through polars (reqwest, hyper-rustls). ring rather than
# aws-lc-rs, which needs cmake and nasm to build on Windows.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

# MCP
rmcp = { version = "3", default-features = false }

# Development
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
criterion = { version = "0.8", default-features = false }
rust_xlsxwriter = "0.104"
# xtask only: machine description of benchmark results. Already built for polars.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Full debug symbols for every dependency cost about 1 GB per test binary
# once Polars `lazy` is enabled. Line tables keep backtraces readable.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
