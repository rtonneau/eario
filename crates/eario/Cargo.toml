[package]
name = "eario"
description = "Local-first framework for building interactive dashboards and data exploration tools in Rust."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Serves a read-only Model Context Protocol endpoint beside the dashboard,
# once the application also calls `Dashboard::mcp(true)`.
mcp = ["dep:eario-mcp"]

[dependencies]
eario-core.workspace = true
eario-data.workspace = true
eario-runtime.workspace = true
eario-mcp = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
