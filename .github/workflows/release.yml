name: Release

# On a version tag `v<workspace version>`, builds data-explorer, signal-lab
# and the hub for the four targets the hub knows, signs their
# SHA256SUMS.txt with the Eario release key and attaches everything to a
# draft GitHub release, through the reusable release-dashboard.yml. Publish
# the draft for hubs to see it: a hub updates itself from the latest
# published release. It does not publish anything to crates.io.
#
# Needs the secrets MINISIGN_SECRET_KEY (the secret key file of the Eario
# release key) and MINISIGN_PASSWORD (its password), and
# crates/eario-hub/eario-release.pub to be that key's public key file: while
# it is the placeholder, the release stops before building, so no hub release
# is signed with a key that no hub holds. See docs/development/guide.md,
# "Publishing a release".

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/release-dashboard.yml
    with:
      # A hub installs each example by its slug (the default catalog lists
      # both) and updates itself from eario-hub-<target triple>[.exe].
      executables: >-
        [
          {"package": "data-explorer"},
          {"package": "signal-lab"},
          {"package": "eario-hub", "probe": "version"}
        ]
      # The key compiled into the hub, which verifies its self-update.
      public-key: crates/eario-hub/eario-release.pub
      attach-public-key: true
      publish: false
      # eario-runtime embeds the built frontend.
      node-version: '24'
      before-build: cargo xtask frontend
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
