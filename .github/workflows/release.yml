name: Release

# Builds the data-explorer example as a standalone executable for each
# platform when a version tag is pushed, and attaches the files to a draft
# GitHub release. It does not publish anything to crates.io.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: data-explorer
            archive: data-explorer-linux-x86_64
          - os: windows-latest
            binary: data-explorer.exe
            archive: data-explorer-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the frontend and the executable
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create a draft release with the executables
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/data-explorer-linux-x86_64/data-explorer data-explorer-linux-x86_64
          mv artifacts/data-explorer-windows-x86_64/data-explorer.exe data-explorer-windows-x86_64.exe
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            data-explorer-linux-x86_64 data-explorer-windows-x86_64.exe
